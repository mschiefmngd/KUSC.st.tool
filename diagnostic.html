<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>역량을 전략적으로</title>
<meta name="theme-color" content="#FDFCF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="전략 진단">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#DEDACF; --paper:#FDFCF7; --ink:#232018; --ink-60:#6B6459; --ink-30:#A9A295;
  --rule:#E6E1D4; --line:#EFF2F3; --pen:#2F5BD0; --pen-soft:rgba(47,91,208,.09);
  --red:#D9503F; --grn:#2E8B62; --amb:#C08418;
  --tint:rgba(35,32,24,.05); --tint2:rgba(47,91,208,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--desk)}
body{background:var(--desk);color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;padding:0 0 60px;line-height:1.75}
.mono{font-family:'IBM Plex Mono',monospace;font-feature-settings:"tnum"}

.sheet{max-width:700px;margin:0 auto;background:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--line) 33px 34px);
  background-position:0 90px;
  box-shadow:0 1px 3px rgba(0,0,0,.09),0 14px 40px rgba(0,0,0,.09);
  min-height:100vh;padding:0 30px 70px 46px;position:relative;overflow:hidden}
.sheet:before{content:"";position:absolute;left:26px;top:0;bottom:0;width:1px;
  background:rgba(217,80,63,.32)}
.prog{height:3px;background:var(--rule);position:sticky;top:0;z-index:20;margin:0 -30px 0 -46px}
.prog i{display:block;height:100%;background:var(--pen);width:0;transition:width .35s cubic-bezier(.4,0,.2,1)}
.pad{padding-top:26px}
.stamp{font-size:11px;letter-spacing:.1em;color:var(--ink-30);text-align:right}

h1{font-family:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',cursive;font-size:60px;font-weight:700;line-height:1.05;margin:44px 0 4px}
h1 i{font-style:normal;color:var(--pen)}
.lede{font-size:16px;line-height:1.95;color:var(--ink-60);margin:24px 0;max-width:540px}
.lede b{color:var(--ink);font-weight:400;background:linear-gradient(transparent 62%,rgba(47,91,208,.20) 0)}
.note{font-family:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',cursive;font-size:21px;color:var(--pen);margin:28px 0 8px;transform:rotate(-.6deg)}

.qnum{font-size:11px;letter-spacing:.1em;color:var(--ink-30);padding-top:28px}
.qtext{font-family:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',cursive;font-size:31px;font-weight:700;line-height:1.35;margin:8px 0 10px}
.qsub{font-size:15px;color:var(--ink-60);line-height:1.9;margin-bottom:22px}
.qask{font-family:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',cursive;font-size:22px;color:var(--pen);margin-bottom:13px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--tint);
  border:1px solid var(--rule);border-radius:12px;padding:15px 15px;font:inherit;
  font-size:15.5px;line-height:1.6;cursor:pointer;color:var(--ink);
  transition:border-color .13s,background .13s,transform .13s}
.opt:hover{border-color:var(--pen);background:var(--pen-soft);transform:translateX(3px)}
.opt .k{font-family:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',cursive;font-size:19px;color:var(--ink-30);line-height:1.3;min-width:15px}
.opt:hover .k{color:var(--pen)}

.grp{font-family:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',cursive;font-size:20px;color:var(--pen);margin:22px 0 7px}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk label{background:var(--tint);border:1px solid var(--rule);border-radius:12px;padding:14px;
  font-size:15px;cursor:pointer;display:flex;align-items:center;gap:11px;transition:.13s}
.chk label:hover{border-color:var(--pen);background:var(--pen-soft)}
.chk input{appearance:none;width:18px;height:18px;border:1.5px solid var(--ink-30);
  border-radius:6px;flex-shrink:0;cursor:pointer;transition:.13s}
.chk input:checked{background:var(--pen);border-color:var(--pen);box-shadow:inset 0 0 0 3.5px var(--paper)}

.btn{background:var(--ink);color:var(--paper);border:none;border-radius:13px;padding:17px 26px;
  font-family:'Gowun Dodum',sans-serif;font-size:16px;cursor:pointer;width:100%;margin-top:20px;
  transition:background .13s}
.btn:hover{background:var(--pen)}
.btn.alt{background:none;color:var(--ink-60);border:1px solid var(--rule);margin-top:9px}
.btn.restart{background:var(--pen);color:var(--paper);border:none;margin-top:18px}
.btn.restart:hover{background:#1E45A8}
.btn.ghostpen{background:none;color:var(--pen);border:1.5px solid var(--pen);margin-top:9px}
.btn.ghostpen:hover{background:var(--tint2)}
.btn.alt:hover{background:var(--pen-soft);color:var(--pen);border-color:var(--pen)}

.rcode{font-size:11px;letter-spacing:.12em;color:var(--ink-30);padding-top:28px}
.rtitle{font-family:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',cursive;font-size:43px;font-weight:700;line-height:1.2;margin:6px 0 2px}
.rtitle i{font-style:normal;color:var(--pen)}
.stage{font-size:14.5px;color:var(--ink-60);margin-top:8px}

.hexwrap{margin:22px 0 4px;text-align:center}
.legend{display:flex;justify-content:center;gap:20px;font-size:13px;color:var(--ink-60);margin-top:2px}
.legend span{display:flex;align-items:center;gap:7px}
.sw{width:15px;height:3px;background:var(--pen);border-radius:2px}
.sw.d{background:none;border-top:2px dashed var(--ink);height:0}

/* scorecard */
.sc{margin:26px 0 6px;border-top:1px solid var(--ink)}
.scr{display:grid;grid-template-columns:84px 1fr 74px;gap:11px;align-items:center;
  padding:12px 0;border-bottom:1px dashed var(--rule)}
.scr .nm{font-size:13.5px}
.scr .tr{height:11px;background:var(--rule);border-radius:6px;position:relative;overflow:visible}
.scr .fl{height:100%;border-radius:6px;background:var(--pen)}
.scr .tk{position:absolute;top:-5px;width:2px;height:21px;background:var(--ink)}
.scr .stt{font-size:12.5px;text-align:right;white-space:nowrap}
.ok{color:var(--grn)} .mid{color:var(--amb)} .low{color:var(--red)}
.sclg{font-size:12px;color:var(--ink-30);text-align:right;padding-top:8px}

.card{background:var(--tint);border:1px solid var(--rule);border-radius:14px;
  padding:19px;margin:20px 0;font-size:15.5px;line-height:1.9}
.card.hl{border-color:var(--pen);background:var(--tint2)}
.card .ct{font-family:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',cursive;font-size:23px;margin-bottom:8px}
.card p{margin-bottom:11px}
.card p:last-child{margin-bottom:0}
.card b{font-weight:400;background:linear-gradient(transparent 62%,rgba(47,91,208,.22) 0)}

.blabel{font-family:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',cursive;font-size:24px;color:var(--pen);margin:36px 0 13px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:12px 2px;
  border-bottom:1px dashed var(--rule);font-size:15px}
.kv .r{text-align:right}
.kv .r b{font-weight:400;color:var(--pen)}

.goal{background:var(--tint);border:1px solid var(--rule);border-radius:14px;padding:19px;margin-bottom:12px}
.goal .why-tag{display:inline-block;font-size:12px;color:var(--pen);background:var(--pen-soft);
  border-radius:20px;padding:4px 11px;margin-bottom:10px;line-height:1.5}
.goal .gt{font-family:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',cursive;font-size:27px;font-weight:700;line-height:1.3;margin-bottom:14px}
.goal dl{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;font-size:14.5px;line-height:1.85}
.goal dt{white-space:nowrap;color:var(--ink-30);font-size:13px;padding-top:3px}
.goal dd{color:var(--ink-60)}
.goal dd b{color:var(--ink);font-weight:400}
.goal ul{list-style:none;margin:0;padding:0}
.goal ul li{position:relative;padding:0 0 9px 15px;color:var(--ink-60)}
.goal ul li:last-child{padding-bottom:0}
.goal ul li:before{content:"·";position:absolute;left:2px;color:var(--pen);font-weight:700}
.goal ul li b{color:var(--ink);font-weight:400}

details.exp{border-bottom:1px dashed var(--rule);transition:background .15s}
details.exp[open]{background:var(--tint2);border:1px solid rgba(47,91,208,.28);
  border-radius:12px;margin:10px 0;padding:0 14px}
details.exp[open] summary{border-bottom:1px solid rgba(47,91,208,.25);margin-bottom:12px}
details.exp summary{padding:15px 2px;font-size:15px;cursor:pointer;list-style:none;
  display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
details.exp summary::-webkit-details-marker{display:none}
details.exp summary:after{content:"＋";color:var(--pen);font-size:14px}
details.exp[open] summary:after{content:"－"}
.vtag{font-size:12.5px;white-space:nowrap}
.mychoice{background:var(--tint2);border-radius:10px;padding:12px 14px;margin:2px 0 14px;
  font-size:14.5px;line-height:1.7}
.mychoice em{font-style:normal;font-size:12px;color:var(--pen);display:block;margin-bottom:3px}
details.exp .ex{padding:0 2px 18px}
details.exp .ex p{font-size:14.5px;line-height:1.9;color:var(--ink-60);margin-bottom:12px}
details.exp .ex p:last-child{margin-bottom:0}
details.exp .ex b{color:var(--ink);font-weight:400;background:linear-gradient(transparent 62%,rgba(47,91,208,.18) 0)}
details.exp .ex q{color:var(--ink);quotes:"“" "”"}

.foot{font-size:13.5px;color:var(--ink-30);line-height:1.95;margin-top:32px;
  padding-top:18px;border-top:1px dashed var(--rule)}
.adm{background:none;border:none;font:inherit;font-size:11px;color:var(--ink-30);
  cursor:pointer;letter-spacing:.06em;padding:28px 0 0}
.adm:hover{color:var(--pen)}
.bar{height:22px;background:var(--rule);border-radius:6px;position:relative;margin:5px 0 3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen);border-radius:6px}
.bar span{position:absolute;right:9px;top:1px;font-size:12px;color:var(--ink)}
.brow{font-size:14px;margin-bottom:11px}
.brow .l{display:flex;gap:9px;color:var(--ink-60)}
.pw{width:100%;border:1px solid var(--rule);border-radius:12px;padding:15px;font:inherit;
  font-size:16px;background:var(--tint);margin-top:14px}
.pw:focus{outline:none;border-color:var(--pen)}
.topbar{display:flex;justify-content:flex-end;padding-top:8px;margin-bottom:-14px}
.home{background:none;border:none;font:inherit;font-size:12.5px;color:var(--ink-30);
  cursor:pointer;padding:4px 0}
.home:hover{color:var(--pen)}
#offbadge{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;
  background:var(--ink);color:var(--paper);border-radius:20px;padding:8px 16px;
  font-size:12.5px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.empty{font-size:15px;color:var(--ink-30);padding:40px 0;text-align:center;line-height:2}
.field{margin-bottom:15px}
.field label{display:block;font-size:13.5px;color:var(--ink-60);margin-bottom:6px}
.field input,.field select{width:100%;border:1px solid var(--rule);border-radius:11px;
  padding:14px;font:inherit;font-size:15.5px;background:var(--tint);color:var(--ink)}
.field input:focus,.field select:focus{outline:none;border-color:var(--pen)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.err{color:var(--red);font-size:13.5px;margin-top:-6px;margin-bottom:12px;display:none}
.radio{display:flex;flex-direction:column;gap:8px}
.radio label{background:var(--tint);border:1px solid var(--rule);border-radius:12px;padding:13px 15px;
  font-size:15px;cursor:pointer;display:flex;align-items:center;gap:11px;transition:.13s}
.radio label:hover{border-color:var(--pen)}
.radio input{appearance:none;width:18px;height:18px;border:1.5px solid var(--ink-30);
  border-radius:50%;flex-shrink:0;cursor:pointer}
.radio input:checked{background:var(--pen);border-color:var(--pen);box-shadow:inset 0 0 0 3.5px var(--paper)}
.banner{background:var(--tint2);border:1px solid var(--pen);border-radius:12px;padding:12px 15px;
  font-size:14px;color:var(--pen);margin:16px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.tbl th{text-align:left;font-weight:400;color:var(--ink-30);font-size:11.5px;
  border-bottom:1px solid var(--ink);padding:8px 6px;white-space:nowrap}
.tbl td{border-bottom:1px dashed var(--rule);padding:9px 6px;white-space:nowrap}
.tblwrap{overflow-x:auto;margin-bottom:8px}
.pill{display:inline-block;font-size:11px;background:var(--tint2);color:var(--pen);
  border-radius:20px;padding:2px 9px}

@media(max-width:600px){
  .sheet{padding:0 16px 60px 30px}
  .sheet:before{left:15px}
  .prog{margin:0 -16px 0 -30px}
  h1{font-size:45px}
  .rtitle{font-size:32px}
  .qtext{font-size:26px}
  .chk{grid-template-columns:1fr}
  .scr{grid-template-columns:72px 1fr 66px;gap:8px}
  .scr .nm{font-size:12.5px}
  .scr .stt{font-size:11.5px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.homelink{display:inline-block;font-size:13px;color:var(--ink-60);text-decoration:none;padding-top:18px}
.homelink:hover{color:var(--pen)}
</style>
</head>
<body>
<div id="offbadge">오프라인이에요 · 응답은 저장해뒀다가 자동으로 전송합니다</div>
<div class="sheet">
  <div class="prog"><i id="prog"></i></div>
  <div id="app" class="pad"></div>
</div>

<script>
/* ===== 설정 ===== */
const ADMIN_PW = "";             /* ENDPOINT를 쓰면 비워두세요. 비밀번호는 Apps Script의 ADMIN_KEY에 둡니다 */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzr2-vwdBV4v7U6qliXPlFWWu0Mo9S7tC7_70xqGdqeCd0wPDmUB52FyB7xB510o-oT/exec";             /* Google Apps Script 웹앱 URL을 여기에 붙여넣으세요 */
const GRADES=["1학년","2학년","3학년","4학년","졸업생/수료"];
const GENDERS=["남","여","응답하지 않음"];

const AXES=["구조화","수치화","가설 수립","정보 탐색","커뮤니케이션","실행 지구력"];
/* 받침 유무에 따라 조사를 고르는 함수 */
function jong(w){if(!w)return false;const c=w.charCodeAt(w.length-1);
  if(c>=0xAC00&&c<=0xD7A3)return (c-0xAC00)%28!==0;
  return false}
function J1(w,a,b){return w+(jong(w)?a:b)}                 /* 은/는, 이/가 ... */
function JJ(w,a,b,has){return w+((has===undefined?jong(w):has)?a:b)}
function PO(w,a,b){return jong(w)?a:b}                    /* 조사만 반환 */
function POh(a,b,has){return has?a:b}                     /* 영문 직무명용 */
const VTAG={25:["가장 좋은 선택","ok"],16:["괜찮은 선택","ok"],8:["아쉬운 선택","mid"],0:["다시 볼 만한 선택","low"]};

const Q=[
{ax:0,t:"동아리 신입 지원서 50장이 도착했어요",
 s:"운영진 3명이 이틀 안에 읽고 면접 대상 15명을 추려야 해요. 다들 시험 기간이라 시간이 빠듯합니다.",
 ask:"당신이 팀원에게 제안하는 방식은?",
 o:[["셋이 나눠서 각자 5명씩 골라 오기로 한다",0],
    ["셋이 50장을 다 읽고 다 같이 모여서 토론하기로 한다",8],
    ["작년에 들어와서 잘한 신입들의 공통점을 먼저 뽑고, 그 기준으로 거른다",16],
    ["우리한테 어떤 사람이 필요한지 조건 셋을 먼저 합의하고, 각자 점수를 매긴다",25]],
 e:["가장 좋은 선택은 <q>조건 셋을 먼저 합의하고 각자 점수를 매긴다</q>예요. <b>읽기 전에 기준을 세웠기 때문에 세 사람의 판단이 하나로 모입니다.</b>",
    "<q>50장을 다 읽고 다 같이 토론한다</q>는 제일 성실해 보이지만 아쉬운 쪽이에요. 시간은 세 배로 쓰는데, 기준이 없으면 결론은 결국 목소리 큰 사람 쪽으로 갑니다.",
    "<q>작년에 잘한 신입들의 공통점으로 거른다</q>는 합리적으로 보이는 함정이에요. 과거에 뽑힌 사람들의 특징은 사실 과거 선발 기준의 복사본이거든요. 기준을 빌려오는 것과 세우는 것은 다릅니다.",
    "<q>각자 5명씩 골라 온다</q>는 가장 빠르지만, 세 사람의 기준이 제각각이라 결과가 섞여버려요."]},

{ax:0,t:"MT 단톡방에 메시지가 300개 쌓였어요",
 s:"장소도 날짜도 회비도 대화 중간중간에 흩어져 있어요. 내일 아침까지 공지를 올려야 합니다.",
 ask:"당신이 공지를 만드는 방식은?",
 o:[["단톡방에 \"결정된 게 뭐였죠?\" 하고 물어본다",0],
    ["처음부터 끝까지 읽으면서 결정된 내용이 나올 때마다 순서대로 받아 적는다",8],
    ["정해진 것과 아직 안 정해진 것, 두 덩어리로 나눠서 적는다",16],
    ["장소·날짜·회비·준비물 칸을 먼저 만들어두고, 읽으면서 칸을 채운다",25]],
 e:["가장 좋은 선택은 <q>칸을 먼저 만들어두고 채운다</q>예요. <b>안 채워진 칸이 곧 '아직 안 정해진 것'으로 저절로 드러납니다.</b>",
    "<q>순서대로 받아 적는다</q>는 300개를 다 읽으니 노동량은 제일 많은데, 시간순으로 옮기면 빠진 게 안 보여요. 회의록과 보고서의 차이가 정확히 이겁니다.",
    "<q>두 덩어리로 나눠서 적는다</q>는 분류를 했다는 점에서 한 걸음 나아갔어요. 다만 어떤 항목이 필요한지는 여전히 안 보입니다.",
    "<q>결정된 게 뭐였죠 하고 물어본다</q>는 정리를 남에게 넘기는 셈이라, 결국 같은 질문이 반복돼요."]},

{ax:1,t:"축제 부스에서 이틀간 음료를 팔았어요",
 s:"남은 건 영수증 한 뭉치랑 판매 기록 노트뿐이에요. 회장님이 \"정산 좀 해줘\"라고 합니다.",
 ask:"정산을 맡은 당신이 하는 일은?",
 o:[["영수증을 하나도 빠짐없이 엑셀에 옮겨 적는다",0],
    ["총 매출에서 총 지출을 빼서 얼마 남았는지 보고한다",8],
    ["처음 예상했던 금액이랑 얼마나 차이 나는지 비교해본다",16],
    ["한 잔 팔 때마다 실제로 얼마가 남았는지 계산해본다",25]],
 e:["가장 좋은 선택은 <q>한 잔 팔 때마다 얼마가 남았는지 계산한다</q>예요. <b>한 잔당 남는 돈을 알면 다음에 몇 잔을 팔아야 하는지까지 나옵니다.</b> 실무에서 유닛 이코노믹스라고 부르는 게 이거예요.",
    "<q>영수증을 빠짐없이 엑셀에 옮긴다</q>는 시간을 가장 많이 쓰는데 얻는 게 가장 적어요. 옮기는 건 작업이지 분석이 아니거든요.",
    "<q>총 매출에서 총 지출을 뺀다</q>는 결과는 나오지만 '그래서 다음엔 뭘 바꿔야 하나'에는 답을 못 합니다.",
    "<q>예상 금액과 비교한다</q>는 기준이 생겼다는 점에서 좋은 접근이에요. 다만 왜 차이가 났는지까지는 아직 안 나옵니다."]},

{ax:1,t:"동아리 회비는 매년 오르는데 늘 부족해요",
 s:"회장이 \"왜 계속 모자란지 좀 봐줘\"라고 부탁했어요. 최근 3년치 결산 자료가 있습니다.",
 ask:"보고하기 전, 당신이 먼저 확인하는 것은?",
 o:[["얼마를 더 올려야 적자가 안 나는지 계산한다",0],
    ["돈이 가장 많이 나간 행사가 뭔지 찾는다",8],
    ["지출 항목별로 작년과 올해를 나란히 놓고 비교한다",16],
    ["인원이 줄어든 건지, 1인당 지출이 늘어난 건지 나눠서 본다",25]],
 e:["가장 좋은 선택은 <q>인원이 줄었는지, 1인당 지출이 늘었는지 나눠서 본다</q>예요. <b>총액이 같아도 인원이 줄어든 거라면 원인이 완전히 다르거든요.</b> 분자와 분모를 분리하는 데서 모든 수치 분석이 시작합니다.",
    "<q>가장 많이 나간 행사를 찾는다</q>는 늘 그럴듯해 보이는 함정이에요. 큰 항목인 것과 나빠진 항목인 것은 다릅니다. MT 비용이 전체의 40%인 건 원래 그런 거니까요.",
    "<q>얼마를 더 올려야 하는지 계산한다</q>는 부탁받은 게 원인인데 해법으로 건너뛴 거예요. 면접에서 가장 빨리 걸리는 패턴입니다.",
    "<q>작년과 올해를 비교한다</q>는 변화를 본다는 점에서 좋아요. 여기서 한 발만 더 가면 만점입니다."]},

{ax:2,t:"\"우리 학교 애들, 한 달에 커피에 얼마나 쓸까?\"",
 s:"밥 먹다가 친구가 갑자기 물어봤어요. 폰은 주머니에 있고, 검색은 좀 치사한 상황.",
 ask:"그 자리에서 당신이 답하는 방식은?",
 o:[["사람마다 다르니까 답할 수 없다고 한다",0],
    ["내가 한 달에 쓰는 돈이 얼마인지 말해준다",8],
    ["옆에 있는 친구들한테 물어보고 평균을 낸다",16],
    ["하루에 몇 잔 마시는지부터 정하고 곱해나간다",25]],
 e:["가장 좋은 선택은 <q>하루에 몇 잔인지부터 정하고 곱해나간다</q>예요. <b>표본이 하나도 없어도 구조가 있으면 답이 나옵니다.</b> 가정 하나만 바꿔보면 답이 얼마나 달라지는지도 알 수 있고요.",
    "<q>답할 수 없다</q>는 가장 정확한 말인데 실무에서는 가장 곤란한 답이에요. 전략 업무의 거의 전부가 불완전한 정보로 결론을 내는 일이거든요.",
    "<q>친구들한테 물어보고 평균을 낸다</q>는 표본을 늘렸으니 정확해 보이지만, 옆에 있는 친구들은 나랑 비슷한 사람들이라 편향은 그대로예요. 숫자가 생기면서 틀린 확신만 붙습니다.",
    "<q>내가 쓰는 돈을 말해준다</q>는 시작점으로는 나쁘지 않아요. 여기서 '나는 평균보다 많이 쓰는 편인가'까지 가면 훨씬 좋아집니다."]},

{ax:2,t:"새로운 행사를 하나 해보자고 제안했어요",
 s:"회의실이 조용해지더니 누군가 물어봅니다. \"그게 될 것 같아?\"",
 ask:"당신이 다음 회의에 들고 가는 것은?",
 o:[["일단 해보고 안 되면 접으면 된다고 설득한다",0],
    ["다른 학교에서 비슷한 행사로 성공한 사례를 찾아서 보여준다",8],
    ["어떤 조건이 갖춰지면 되는 건지 정리해서 보여준다",16],
    ["아주 작게 한 번 해보고 반응을 보자고 제안한다",25]],
 e:["가장 좋은 선택은 <q>아주 작게 한 번 해보고 반응을 보자</q>예요. <b>가장 적은 비용으로 가정을 확인하는 방법이거든요.</b> VC가 초기 기업을 볼 때 확인하는 게 정확히 이 감각입니다.",
    "<q>다른 학교 성공 사례를 찾아서 보여준다</q>는 준비는 제일 많이 필요한데 설득력은 약해요. 남이 성공한 이유가 우리한테도 성립하는지는 증명하지 못하니까요.",
    "<q>어떤 조건이 갖춰지면 되는지 정리한다</q>는 가정을 드러냈다는 점에서 좋은 답이에요. 다만 그 조건이 실제로 맞는지는 아직 아무도 모릅니다.",
    "<q>안 되면 접으면 된다</q>는 열정은 전해지지만, 듣는 사람의 걱정은 하나도 해소되지 않아요."]},

{ax:3,t:"가고 싶은 회사 공고에 \"관련 경험 우대\"라고만 적혀 있어요",
 s:"그게 뭘 말하는 건지 감이 안 와요. 마감까지는 3주 남았습니다.",
 ask:"당신이 실제로 하는 행동은?",
 o:[["우대사항이니까 없어도 된다고 보고 그냥 지원한다",0],
    ["취업 커뮤니티에 글을 올려서 물어본다",8],
    ["비슷한 공고를 열 개쯤 모아서 공통점을 찾아본다",16],
    ["그 회사 다니는 사람을 수소문해서 직접 물어본다",25]],
 e:["가장 좋은 선택은 <q>그 회사 다니는 사람에게 직접 물어본다</q>예요. <b>높은 점수의 이유는 노력의 양이 아니라 희소성입니다.</b> 모두가 가진 정보로는 판단이 갈리지 않으니까요.",
    "<q>비슷한 공고를 열 개 모은다</q>는 성실한 리서치처럼 보이지만, 공고는 인사팀이 쓴 문서지 실제 업무 요건이 아니에요.",
    "<q>커뮤니티에 물어본다</q>는 답이 오긴 하는데, 그 답을 쓴 사람이 누구인지 알 수 없습니다.",
    "<q>그냥 지원한다</q>는 시간은 아끼지만, 서류에서 뭘 강조해야 할지 모른 채 쓰게 돼요."]},

{ax:3,t:"지원하려던 회사에 \"워라밸 최악\"이라는 글을 봤어요",
 s:"추천 수도 꽤 높고 댓글도 비슷한 얘기예요. 마음이 흔들립니다.",
 ask:"당신이 다음으로 하는 행동은?",
 o:[["글도 많고 댓글도 비슷하니까 사실이라고 보고 접는다",0],
    ["다른 커뮤니티에도 같은 얘기가 있는지 더 찾아본다",8],
    ["글쓴이가 언제, 어느 부서에 있었는지부터 확인한다",16],
    ["그 회사 다니는 사람 두세 명한테 직접 물어본다",25]],
 e:["가장 좋은 선택은 <q>재직자 두세 명에게 직접 물어본다</q>예요. <b>사실 자체를 확인하는 유일한 방법이거든요.</b>",
    "<q>다른 커뮤니티에서 더 찾아본다</q>는 교차검증처럼 보이지만 아니에요. 같은 성격의 출처를 반복하는 건 같은 편향을 여러 번 확인하는 겁니다. 게다가 회사 후기는 구조적으로 불만 있는 사람이 더 많이 써요.",
    "<q>글쓴이가 언제 어느 부서에 있었는지 확인한다</q>는 출처의 위치와 동기를 본다는 점에서 실사의 기본에 가까워요.",
    "<q>사실이라고 보고 접는다</q>는 추천 수를 진실로 착각하는 건데, 그러다 남들이 안 가는 좋은 자리를 놓칠 수 있어요."]},

{ax:4,t:"발표 5분 전, \"3분 안에 끝내라\"는 말을 들었어요",
 s:"준비한 건 10분 분량이고, 슬라이드는 18장이에요. 앞 팀이 시간을 다 써버렸습니다.",
 ask:"단상에 올라가기 직전, 당신의 선택은?",
 o:[["준비한 순서 그대로 최대한 빠르게 말한다",0],
    ["뒷부분을 잘라내고 앞부분만 제대로 한다",8],
    ["슬라이드를 빠르게 넘기면서 핵심만 요약한다",16],
    ["결론이랑 이유 하나만 말하고, 나머지는 질문받겠다고 한다",25]],
 e:["가장 좋은 선택은 <q>결론과 이유 하나만 말하고 나머지는 질문받는다</q>예요. <b>임원 보고의 기본형입니다.</b> 실제로 3분 안에 결론이 안 나오면 중간에 끊겨요.",
    "<q>뒷부분을 잘라내고 앞부분만 한다</q>는 가장 흔한 선택인데, 대부분의 발표는 뒤로 갈수록 중요해요. 앞을 살리면 결론이 날아갑니다.",
    "<q>슬라이드를 빠르게 넘기며 요약한다</q>는 내용을 조정했다는 점에서 좋아요. 다만 뭘 남길지 기준이 없으면 요약이 아니라 축약이 됩니다.",
    "<q>그대로 최대한 빠르게 말한다</q>는 3분 안에 끝나지도 않고 전달도 안 돼요."]},

{ax:4,t:"팀이 이미 정한 방향이 아무래도 아닌 것 같아요",
 s:"지난주에 결정된 건이고, 바꿀 수 있는 건 사실상 지금이 마지막이에요.",
 ask:"당신이 실제로 해본 것에 가장 가까운 건?",
 o:[["그냥 따랐다. 이미 정해진 거니까",0],
    ["회의에서 반대 의견을 말했다",8],
    ["반대하는 이유랑 대안을 같이 준비해서 말했다",16],
    ["팀이 뭘 걱정하는지 먼저 듣고, 그 걱정에 맞춰서 설득했다",25]],
 e:["가장 좋은 선택은 <q>팀이 뭘 걱정하는지 먼저 듣고 그 걱정에 맞춰 설득했다</q>예요. <b>결정에는 늘 그 결정을 내린 이유가 있고, 그 이유를 건드리지 않는 대안은 채택되지 않기 때문</b>입니다.",
    "예를 들어 팀이 그 방향을 고른 진짜 이유가 <b>일정</b>이었다면, 품질이 더 낫다는 근거를 아무리 쌓아도 서로 다른 얘기를 하게 돼요. 반대로 '이 방식으로도 마감을 맞출 수 있다'를 먼저 보여주면 같은 대안이 바로 통과됩니다.",
    "<q>이유와 대안을 같이 준비해서 말했다</q>는 논리적으로는 완벽한 준비예요. 다만 상대의 판단 기준이 일정인지, 리스크인지, 책임 소재인지를 모른 채 말하면 준비한 만큼 전달되지 않습니다. 실무에서 좋은 분석이 반려되는 이유의 대부분이 여기예요.",
    "<q>회의에서 반대 의견을 말했다</q>는 말을 꺼낸 것만으로도 대부분보다 나아요. 다만 한 번에 끝났다면 거기서 멈춘 겁니다.",
    "<q>그냥 따랐다</q>를 고르셨다면 능력이 없어서가 아니라 그런 상황을 겪을 기회가 없었을 수도 있어요. 이건 지금부터 만들면 되는 경험입니다."]},

{ax:5,t:"시작한 지 3개월쯤 됐는데, 재미도 없고 성과도 안 보여요",
 s:"동아리든 스터디든 프로젝트든, 그런 순간이 한 번쯤은 있었을 거예요.",
 ask:"그때 당신은 대체로 어떻게 했나요?",
 o:[["대부분 그만뒀다",0],
    ["끝내긴 했는데 최소한으로만 마무리했다",8],
    ["주변에 소문을 내서 못 빠져나가게 만들었다",16],
    ["방식을 이것저것 바꿔가면서 계속했다",25]],
 e:["가장 좋은 선택은 <q>방식을 바꿔가면서 계속했다</q>예요. <b>전략 업무는 3개월에서 3년짜리인데, 처음 세운 가설은 거의 반드시 틀립니다.</b> 그래서 밀어붙이는 사람보다 중간에 방향을 고치는 사람이 결과를 내요.",
    "<q>최소한으로만 마무리했다</q>는 완주는 했지만, 실무에서는 완주 여부보다 완주의 질이 기록으로 남아요. 그리고 이 방식이 한 번 몸에 배면 그게 기본값이 됩니다.",
    "<q>소문을 내서 못 빠져나가게 만들었다</q>는 꽤 영리한 방법이에요. 다만 압력이 사라지면 멈추고, 안 되는 방식을 그대로 유지한 채 버티게 됩니다.",
    "<q>대부분 그만뒀다</q>는 그 판단이 맞았을 수도 있어요. 다만 왜 그만뒀는지를 남겨두지 않으면 다음에도 같은 지점에서 멈춥니다."]},

{ax:5,t:"누가 시키지도 않았는데 끝까지 만들어본 것",
 s:"과제도 좋고, 사이드 프로젝트도 좋고, 동아리 자료도 좋아요.",
 ask:"지금까지 해본 것 중 가장 가까운 건?",
 o:[["딱히 없다",0],
    ["시작은 했는데 중간에 멈춘 게 있다",8],
    ["끝까지 만들었고, 나만 봤다",16],
    ["끝까지 만들었고, 누군가 실제로 썼다",25]],
 e:["가장 좋은 선택은 <q>끝까지 만들었고 누군가 실제로 썼다</q>예요. <b>세상에 내놓는 순간 내 기준이 아니라 남의 기준으로 평가받거든요.</b> 그 한 번의 사이클을 겪은 사람과 아닌 사람이 실무에서 바로 갈립니다.",

function shuffle(n){const a=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function goals(){

  const pushAX=(i,reason)=>{const k="AX"+i;
    if(!used.has(k)&&out.length<3){used.add(k);AXDUP[i].forEach(d=>used.add(d));out.push({...AXFIX[i],reason})}};
  if(st.want&&st.want!=="NONE"){
    const Jb=JOBS[st.want],cmp=Jb.b;
    const diffs=a.map((v,i)=>({i,d:cmp[i]-v})).sort((x,y)=>y.d-x.d);
    pushAX(diffs[0].i,`${JJ(Jb.n,"과","와",Jb.h)} 가장 차이 나는 축이 ${J1(AXES[diffs[0].i],"이라서","라서")}`);
    const miss=Jb.req.filter(r=>!st.items.includes(r));

    Jb.plan.forEach(p=>pushRX(p,`${Jb.n}에서 그다음으로 중요한 준비라서`));
    for(let k=2;k<6&&out.length<3;k++)if(diffs[k].d>0)pushAX(diffs[k].i,`${AXES[diffs[k].i]} 축도 더 올릴 수 있어서`);
  }else{
    const lo=a.map((v,i)=>({i,v})).sort((x,y)=>x.v-y.v);
    pushAX(lo[0].i,`지금 가장 낮은 축이 ${J1(AXES[lo[0].i],"이라서","라서")}`);

    pushRX("project","방향이 정해지기 전에 해둬도 손해가 없어서");
    pushRX("excel","여섯 직무 전부의 기본기라서");
  }
  return out}

/* hexagon — 라벨이 잘리지 않도록 반지름과 여백 조정 */
function hex(a,cmp,Z){
  Z=Z||340;const c=Z/2,R=Z*.255;
  const pt=(v,i,r)=>{const g=-Math.PI/2+i*Math.PI/3,rr=r*(v/50);
    return[c+rr*Math.cos(g),c+rr*Math.sin(g)]};
  let s="";
  for(let k=1;k<=4;k++)s+=`<polygon points="${[...Array(6)].map((_,i)=>pt(50*k/4,i,R).join(",")).join(" ")}" fill="none" stroke="#E6E1D4"/>`;
  for(let i=0;i<6;i++){const[x,y]=pt(50,i,R);s+=`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#E6E1D4"/>`}
  if(cmp)s+=`<polygon points="${cmp.map((v,i)=>pt(v,i,R).join(",")).join(" ")}" fill="none" stroke="#232018" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  s+=`<polygon points="${a.map((v,i)=>pt(v,i,R).join(",")).join(" ")}" fill="rgba(47,91,208,.15)" stroke="#2F5BD0" stroke-width="2.4" stroke-linejoin="round"/>`;
  a.forEach((v,i)=>{const[x,y]=pt(v,i,R);s+=`<circle cx="${x}" cy="${y}" r="3.6" fill="#2F5BD0"/>`});
  AXES.forEach((n,i)=>{
    const[x,y]=pt(62,i,R);
    let anc="middle",dy=5;
    if(i===0)dy=-4; else if(i===3)dy=15;
    else if(i===1||i===2)anc="start"; else anc="end";
    s+=`<text x="${x}" y="${y+dy}" text-anchor="${anc}" font-family="Gaegu,cursive" font-size="16" font-weight="700" fill="#232018">${n}</text>`});
  return `<svg viewBox="0 0 ${Z} ${Z}" width="100%" style="max-width:${Z}px" xmlns="http://www.w3.org/2000/svg">${s}</svg>`}

function scorecard(a,bench,label){
  return `<div class="sc">${AXES.map((n,i)=>{
    const t=bench[i],r=a[i]/t;
    let cls="low",txt="많이 부족";
    if(r>=.95){cls="ok";txt="충분해요"}
    else if(r>=.7){cls="mid";txt="조금 더"}
    const w=Math.min(100,a[i]/50*100),tw=Math.min(100,t/50*100);
    return `<div class="scr">
      <div class="nm">${n}</div>
      <div class="tr"><div class="fl" style="width:${w}%;background:${cls==="ok"?"var(--grn)":cls==="mid"?"var(--amb)":"var(--red)"}"></div>
        <div class="tk" style="left:calc(${tw}% - 1px)"></div></div>
      <div class="stt ${cls}">${txt}</div></div>`}).join("")}
    <div class="sclg">검은 눈금 = ${label} 기준선</div></div>`}

/* 오프라인이면 큐에 넣어두고, 연결되면 자동 전송 */
async function flushOutbox(){
  if(!ENDPOINT)return 0;
  const q=lsGet("kusc:outbox","[]");if(!q.length)return 0;
  const left=[];
  for(const rec of q){
    try{await fetch(ENDPOINT,{method:"POST",mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)})}
    catch(e){left.push(rec)}
  }
  lsSet("kusc:outbox",left);
  return q.length-left.length;
}
async function persist(){
  if(st.admin)return;                      /* 강사 모드에서는 저장하지 않음 */
  const rec=buildRec();
  window.__local=(window.__local||[]).concat(rec);
  lsSet("kusc:mine",lsGet("kusc:mine","[]").concat(rec));   /* 본인 기기 기록 */
  if(ENDPOINT){
    lsSet("kusc:outbox",lsGet("kusc:outbox","[]").concat(rec));
    await flushOutbox();
    return;
  }
  try{await window.storage.set("kusc:r:"+st.code+":"+Date.now(),JSON.stringify(rec),true)}catch(e){}
}

function insights(rows){
  const n=rows.length;if(!n)return "";
  const pct=x=>Math.round(x/n*100);
  const named=rows.filter(r=>r.want&&r.want!=="NONE");

  /* ① 지망과 모양의 일치율 */
  let exact=0,near=0;
  named.forEach(r=>{
    const me=(r.a||[]).map(v=>v/((r.total||1)));
    const rank=Object.keys(JOBS).map(k=>{const b=JOBS[k].b,bt=b.reduce((x,y)=>x+y,0);
      return{k,d:b.map(v=>v/bt).reduce((sm,v,i)=>sm+Math.abs(v-me[i]),0)}}).sort((x,y)=>x.d-y.d);
    if(rank[0].k===r.want)exact++;else if(rank[1].k===r.want)near++;});
  const nn=named.length||1;

  /* ② 가장 많이 걸린 함정 */
  const traps=Q.map((q,i)=>{
    let bad=0,pickTxt="",best=0;
    const cnt=[0,0,0,0];
    rows.forEach(r=>{if(r.ans&&r.ans[i]!=null)cnt[r.ans[i]]++});
    q.o.forEach((o,j)=>{if(o[1]<=8)bad+=cnt[j];if(cnt[j]>best&&o[1]<=8){best=cnt[j];pickTxt=o[0]}});
    return{i,q,bad,pickTxt}}).sort((a,b)=>b.bad-a.bad).slice(0,3);

  /* ③ 가장 의견이 갈린 축 */
  const sd=AXES.map((ax,i)=>{
    const v=rows.map(r=>(r.a||[])[i]||0),m=v.reduce((x,y)=>x+y,0)/n;
    return{i,ax,sd:Math.sqrt(v.reduce((s,x)=>s+(x-m)*(x-m),0)/n),m}}).sort((a,b)=>b.sd-a.sd);

  /* ④ 보유 항목 충족률 */
  const own=ITEMS.map(([k,label])=>({k,label,c:rows.filter(r=>(r.items||[]).includes(k)).length}))
    .sort((a,b)=>a.c-b.c);

  /* ⑤ 지망 그룹별 최대 갭 */
  const byWant={};named.forEach(r=>{(byWant[r.want]=byWant[r.want]||[]).push(r)});
  const gaps=Object.keys(byWant).map(k=>{
    const g=byWant[k],b=JOBS[k].b;
    const avg=AXES.map((_,i)=>g.reduce((s,r)=>s+((r.a||[])[i]||0),0)/g.length);
    const d=avg.map((v,i)=>({i,d:b[i]-v})).sort((x,y)=>y.d-x.d)[0];
    return{k,n:g.length,ax:AXES[d.i],d:Math.round(d.d)}}).sort((a,b)=>b.n-a.n);

  /* ⑥ 워라밸 자신 없는데 강도 높은 직무 지망 */
  const clash=named.filter(r=>r.wl===2&&JOBS[r.want]&&JOBS[r.want].wl>=3);

  /* ⑦ 재응시자 변화 */
  const bySid={};rows.forEach(r=>{if(r.sid)(bySid[r.sid]=bySid[r.sid]||[]).push(r)});
  const again=Object.keys(bySid).filter(k=>bySid[k].length>1).map(k=>{
    const g=bySid[k].slice().sort((a,b)=>(a.ts||"").localeCompare(b.ts||""));
    return{name:g[0].name,from:g[0].total,to:g[g.length-1].total,cnt:g.length}});

  /* ⑧ 학년별 평균 */
  const byGr={};rows.forEach(r=>{const k=r.grade||"미기재";(byGr[k]=byGr[k]||[]).push(r.total||0)});
  const grs=Object.keys(byGr).sort().map(k=>({k,n:byGr[k].length,
    m:Math.round(byGr[k].reduce((x,y)=>x+y,0)/byGr[k].length)}));

  return `
  <div class="blabel">🔍 인사이트</div>

  <div class="card"><div class="ct">① 자기 인식 일치율</div>
    <p>지망 직무를 고른 <b>${nn}명</b> 중 <b>${Math.round(exact/nn*100)}%</b>가 자기 모양과 지망이 정확히 일치했어요.
       2순위까지 포함하면 <b>${Math.round((exact+near)/nn*100)}%</b>입니다.</p>
    <p style="color:var(--ink-30);font-size:13.5px">강의에서: "열 명 중 ${Math.round(exact/nn*10)}명만 자기가 가고 싶은 곳과 지금 모양이 맞았어요. 나머지는 틀린 게 아니라 아직 거리가 있는 겁니다."</p></div>

  <div class="card"><div class="ct">② 가장 많이 걸린 함정</div>
    ${traps.map(t=>`<p><b>${String(t.i+1).padStart(2,"0")}. ${t.q.t}</b><br>
      <span style="color:var(--ink-60)">${pct(t.bad)}%가 낮은 점수 선택지를 골랐어요. 가장 많이 고른 건 "${t.pickTxt}"</span></p>`).join("")}
    <p style="color:var(--ink-30);font-size:13.5px">이 세 문항을 강의 오프닝에서 먼저 던지면 몰입도가 가장 높습니다.</p></div>

  <div class="card"><div class="ct">③ 의견이 가장 갈린 축</div>
    <p><b>${sd[0].ax}</b>에서 학생 간 편차가 가장 컸어요. (평균 ${Math.round(sd[0].m)}점, 편차 ±${Math.round(sd[0].sd)})</p>
    <p>반대로 <b>${sd[sd.length-1].ax}</b>은 다들 비슷했습니다.</p>
    <p style="color:var(--ink-30);font-size:13.5px">편차가 큰 축이 토론이 붙는 축이에요. 조별 워크에서 이 축을 다루면 말이 많이 나옵니다.</p></div>

  <div class="card"><div class="ct">④ 이 기수에 가장 비어 있는 것</div>
    ${own.slice(0,4).map(o=>`<p>${o.label} — <b>${pct(o.c)}%</b> 보유 (${o.c}명)</p>`).join("")}
    <p style="color:var(--ink-30);font-size:13.5px">가장 낮은 항목은 학회 차원의 스터디로 묶으면 효율이 큽니다.</p></div>

  <div class="card"><div class="ct">⑤ 지망 그룹별 가장 큰 갭</div>
    ${gaps.map(g=>`<p><b>${JOBS[g.k].n}</b> 지망 ${g.n}명 → <b>${g.ax}</b>이 평균 ${g.d}점 부족</p>`).join("")}
    <p style="color:var(--ink-30);font-size:13.5px">2강 조 편성과 3강 현직자 배치를 여기에 맞추면 됩니다.</p></div>

  ${clash.length?`<div class="card"><div class="ct">⑥ 눈여겨볼 조합</div>
    <p>워라밸에 <b>자신 없다</b>고 답했는데 강도가 높은 직무(IB·컨설팅)를 지망한 학생이 <b>${clash.length}명</b> 있어요.</p>
    <p style="color:var(--ink-30);font-size:13.5px">3강에서 현직자에게 이 부분을 꼭 물어보게 하세요. 가장 솔직한 답이 필요한 지점입니다.</p></div>`:""}

  ${again.length?`<div class="card"><div class="ct">⑦ 다시 응시한 학생</div>
    ${again.map(a=>`<p>${a.name} — ${a.from}점 → <b>${a.to}점</b> (${a.to-a.from>=0?"+":""}${a.to-a.from}, ${a.cnt}회 응시)</p>`).join("")}
    <p style="color:var(--ink-30);font-size:13.5px">4강 마지막에 이 변화를 보여주면 커리큘럼이 닫힙니다.</p></div>`:""}

  <div class="card"><div class="ct">⑧ 학년별 평균</div>
    ${grs.map(g=>`<p>${g.k} ${g.n}명 — 평균 <b>${g.m}점</b></p>`).join("")}
    <p style="color:var(--ink-30);font-size:13.5px">학년이 올라간다고 저절로 늘지 않는다는 게 보이면, 그 자체가 강한 메시지가 됩니다.</p></div>`;
}

function adminView(){
  const A=el("app"),rows=view(),n=rows.length;
  const days=[...new Set(ADMIN.map(r=>(r.ts||"").slice(0,10)).filter(Boolean))].sort().reverse();
  const head=`<div class="rcode mono">강사 모드</div>
    <div class="rtitle">진단 대시보드</div>
    <div class="banner">${DEMO
      ? "지금 보이는 건 <b>샘플 데이터</b>예요. 실제 응답이 들어오기 시작하면 자동으로 실제 데이터로 바뀝니다."
      : "강사 모드입니다. 이 상태에서 진단을 돌려도 집계에 들어가지 않아요."}</div>
    <button class="btn alt" style="margin-top:0" onclick="toggleDemo()">${DEMO?"실제 데이터 불러오기":"샘플 데이터로 모양 보기"}</button>
    <div class="field" style="margin-top:14px"><label>회차 (응답 날짜)</label>
      <select onchange="setDay(this.value)">
        <option value="ALL"${ADMIN_DAY==="ALL"?" selected":""}>전체 (${ADMIN.length}명)</option>
        ${days.map(d=>`<option value="${d}"${ADMIN_DAY===d?" selected":""}>${d} (${ADMIN.filter(r=>(r.ts||"").slice(0,10)===d).length}명)</option>`).join("")}
      </select></div>`;

  if(!n){A.innerHTML=head+`<div class="empty">이 회차에는 응답이 없어요.</div>
    <button class="btn ghostpen" onclick="setDay('ALL')">전체 보기</button>
    <button class="btn alt" onclick="preview()">진단 화면 미리보기</button>`;return}

  const avg=[0,0,0,0,0,0];rows.forEach(r=>(r.a||[]).forEach((v,i)=>avg[i]+=v));
  const A6=avg.map(v=>Math.round(v/n));
  const wc={},wlc=[0,0,0];
  rows.forEach(r=>{wc[r.want]=(wc[r.want]||0)+1;if(r.wl!=null)wlc[r.wl]++});

  let qs="";
  Q.forEach((q,i)=>{const c=[0,0,0,0];rows.forEach(r=>{if(r.ans&&r.ans[i]!=null)c[r.ans[i]]++});
    qs+=`<div class="blabel" style="font-size:19px;margin:26px 0 5px">${String(i+1).padStart(2,"0")} · ${AXES[q.ax]}</div>
      <div style="font-size:15px;margin-bottom:11px">${q.t}</div>`;
    q.o.forEach((o,j)=>{const p=Math.round(c[j]/n*100);
      qs+=`<div class="brow"><div class="l"><span class="mono">${o[1]}점</span><span>${o[0]}</span></div>
        <div class="bar"><i style="width:${p}%"></i><span>${p}% · ${c[j]}명</span></div></div>`})});

  const tbl=`<div class="tblwrap"><table class="tbl">
    <tr><th>시각</th><th>이름</th><th>학번</th><th>학년</th><th>전공</th><th>지망</th><th>닮은 직무</th><th>총점</th></tr>
    ${rows.map(r=>`<tr>
      <td>${(r.ts||"").slice(5,16).replace("T"," ")}</td>
      <td>${r.name||"-"}</td><td>${r.sid||"-"}</td><td>${(r.grade||"").replace("학년","")}</td>
      <td>${r.major||"-"}</td>
      <td><span class="pill">${r.want==="NONE"?"미정":(JOBS[r.want]?JOBS[r.want].n:"-")}</span></td>
      <td>${JOBS[r.fit]?JOBS[r.fit].n:"-"}</td><td class="mono">${r.total||0}</td></tr>`).join("")}
  </table></div>`;

  const avgTot=Math.round(rows.reduce((x,r)=>x+(r.total||0),0)/n);
  const lowAx=AXES[A6.indexOf(Math.min(...A6))],hiAx=AXES[A6.indexOf(Math.max(...A6))];
  const topWant=Object.keys(wc).sort((a,b)=>wc[b]-wc[a])[0];
  A.innerHTML=head+`
    <div class="blabel">📌 한눈에 보기</div>
    <div class="kv"><span>응답 인원</span><span class="r"><b>${n}명</b></span></div>
    <div class="kv"><span>평균 총점</span><span class="r"><b>${avgTot}</b> / 300</span></div>
    <div class="kv"><span>가장 많은 지망</span><span class="r"><b>${topWant==="NONE"?"아직 모르겠다":(JOBS[topWant]?JOBS[topWant].n:"-")}</b> (${wc[topWant]}명)</span></div>
    <div class="kv"><span>기수 강점 / 약점</span><span class="r">${hiAx} <span style="color:var(--ink-30)">/</span> <b>${lowAx}</b></span></div>
    <div class="blabel">👥 응답자 ${n}명</div>${tbl}
    <button class="btn ghostpen" onclick="csv()">CSV로 내려받기</button>
    <div id="csvbox" style="display:none;margin-top:10px">
      <div style="font-size:13px;color:var(--ink-60);margin-bottom:6px">
        다운로드가 막히면 아래 내용을 복사해 메모장에 붙여넣고 .csv로 저장하세요. (자동 복사 시도됨)</div>
      <textarea style="width:100%;height:130px;font-family:'IBM Plex Mono',monospace;font-size:11px;
        border:1px solid var(--rule);border-radius:10px;padding:10px;background:var(--tint)"></textarea>
    </div>
    <div class="blabel">📐 이번 회차 평균 모양</div>
    <div class="hexwrap">${hex(A6,null,340)}</div>
    <div class="blabel">🎯 지망 직무 분포</div>
    ${Object.keys(wc).sort((a,b)=>wc[b]-wc[a]).map(k=>{const p=Math.round(wc[k]/n*100);
      return `<div class="brow"><div class="l"><span>${k==="NONE"?"아직 모르겠다":(JOBS[k]?JOBS[k].n:k)}</span></div>
        <div class="bar"><i style="width:${p}%"></i><span>${p}% · ${wc[k]}명</span></div></div>`}).join("")}
    <div class="blabel">😅 워라밸 응답</div>
    ${["몇 년은 할 수 있다","한두 해는 버틴다","자신 없다"].map((x,i)=>{const p=Math.round(wlc[i]/n*100);
      return `<div class="brow"><div class="l"><span>${x}</span></div>
        <div class="bar"><i style="width:${p}%"></i><span>${p}% · ${wlc[i]}명</span></div></div>`}).join("")}
    ${insights(rows)}
    <div class="blabel">📊 문항별 응답 분포</div>${qs}
    <button class="btn ghostpen" onclick="admin()">새로고침</button>
    <button class="btn alt" onclick="preview()">진단 화면 미리보기 (저장 안 됨)</button>`;
}
function preview(){resetAll(true)}
initOrder();render();netBadge();flushOutbox().then(netBadge);
</script>
</body>
