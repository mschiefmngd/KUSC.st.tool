<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하프의 7년 · 누가, 언제, 왜 불려오는가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --page:#F2F4F6; --card:#FFFFFF; --ink:#191F28; --sub:#4E5968; --mute:#8B95A1;
  --line:#E5E8EB; --soft:#F6F7F9; --ku:#036B3F; --ku-soft:rgba(3,107,63,.10);
  --skin:#FFDCC2; --hair:#3B2A22; --eye:#2A2A2A; --cheek:#FF9DA0;
  --ground:#DDE1E6; --win:#BFDDFF; --wall:#FFFFFF; --wall2:#E3E9F0; --roof:#036B3F; --edge:#C9CFD6;
  --shadow:0 1px 2px rgba(0,23,51,.04),0 8px 28px rgba(0,23,51,.07);
  --emoji:"Tossface","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#101113; --card:#1B1D21; --ink:#F2F4F6; --sub:#B0B8C1; --mute:#7E8792;
    --line:#2C2F35; --soft:#23262B; --ku:#3DBE84; --ku-soft:rgba(61,190,132,.14);
    --ground:#2A2D33; --win:#3B5876; --wall:#E9EDF1; --wall2:#C9D0D7; --roof:#2FA36E; --edge:transparent;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --page:#101113; --card:#1B1D21; --ink:#F2F4F6; --sub:#B0B8C1; --mute:#7E8792;
  --line:#2C2F35; --soft:#23262B; --ku:#3DBE84; --ku-soft:rgba(61,190,132,.14);
  --ground:#2A2D33; --win:#3B5876; --wall:#E9EDF1; --wall2:#C9D0D7; --roof:#2FA36E; --edge:transparent;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit;margin:0;padding:0}
html,body{height:100%;background:var(--page);color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  letter-spacing:-.02em;-webkit-font-smoothing:antialiased;overflow:hidden;word-break:keep-all}
.e{font-family:var(--emoji);letter-spacing:0;line-height:1}

#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#canvas{width:1280px;height:720px;position:relative;transform-origin:center center}
.slide{position:absolute;inset:0;background:var(--card);border-radius:32px;box-shadow:var(--shadow);padding:34px 48px;display:none;overflow:hidden}
.slide.on{display:block}

/* 헤더 — 모든 장면에서 같은 자리 */
.hud{display:flex;align-items:center;gap:12px;height:38px;margin-bottom:16px}
.stage{display:inline-flex;align-items:center;gap:8px;background:var(--ku-soft);color:var(--ku);font-weight:800;font-size:15px;padding:8px 14px;border-radius:999px}
.yr{font-size:16px;color:var(--sub);font-weight:700}
.body{height:612px}

h1{font-size:64px;font-weight:900;line-height:1.15;letter-spacing:-.04em}
h2{font-size:34px;font-weight:900;line-height:1.25;letter-spacing:-.035em}
h3{font-size:19px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.lead{font-size:19px;color:var(--sub);line-height:1.6;font-weight:500}

.f{opacity:0;transition:opacity .35s ease}
.f.in{opacity:1}

/* 캐릭터 */
.chr{display:block}
.chr .sh{fill:var(--ground)}
.chr .skin{fill:var(--skin)}
.chr .hair{fill:var(--hair)}
.chr .eye{fill:var(--eye)}
.chr .ck{fill:var(--cheek);opacity:.55}
.chr .mouth{fill:none;stroke:var(--eye);stroke-width:2.4;stroke-linecap:round}
.chr .wht{fill:#FFFFFF}
.chr .dk{fill:#2B3036}
.chr .ln{fill:none;stroke:#2B3036;stroke-width:2.6}
.face{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;overflow:hidden;flex-shrink:0}

/* 캐릭터 소개 */
.roster{height:520px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:26px}
.rc{border-radius:24px;padding:26px 16px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--jbg)}
.rc .chr{width:150px;height:175px}
.rc-nick{font-size:13px;font-weight:800;color:var(--jc);margin-top:6px}
.rc-name{font-size:26px;font-weight:900;margin-top:2px}
.rc-one{font-size:15px;color:var(--sub);line-height:1.55;font-weight:600;margin-top:10px;min-height:72px}
.rc-q{margin-top:auto;background:var(--card);border-radius:14px;padding:11px 12px;width:100%;font-size:14.5px;font-weight:800;line-height:1.45}
.rc-q small{display:block;font-size:11.5px;color:var(--jc);font-weight:800;margin-bottom:3px}

/* 월드맵 */
.map{position:relative;margin-top:20px;height:440px}
.map svg.path{position:absolute;inset:0}
.node{position:absolute;width:150px;text-align:center;transform:translate(-50%,-50%)}
.node .disc{width:88px;height:88px;border-radius:28px;background:var(--soft);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:inset 0 0 0 3px var(--line)}
.node .y{font-size:13px;font-weight:800;color:var(--ku)}
.node .t{font-size:16px;font-weight:800;margin-top:2px}

/* ── 장면: 인트로 ── */
.scene{display:grid;grid-template-columns:400px 1fr;gap:36px;height:100%}
.co{background:var(--soft);border-radius:28px;padding:22px;display:flex;flex-direction:column;height:100%;overflow:hidden}
.co-top{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.co-top .lvtag{margin-left:auto;font-size:13px;color:var(--ku);background:var(--ku-soft);padding:5px 11px;border-radius:99px;font-weight:800}
.town{flex:1;display:flex;align-items:center;justify-content:center;margin-top:8px}
.town svg{width:100%;height:auto;display:block}
.cap{font-size:16px;font-weight:800;text-align:center;line-height:1.45;margin:12px 6px 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:16px;padding:11px 12px}
.stat small{display:block;font-size:12px;color:var(--mute);font-weight:700}
.stat b{font-size:18px;font-weight:900;letter-spacing:-.03em;white-space:nowrap}

.right{display:flex;flex-direction:column;height:100%}
.sit h2{margin-bottom:16px}
.sit ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.sit li{font-size:17.5px;line-height:1.5;color:var(--sub);padding-left:20px;position:relative;font-weight:500}
.sit li:before{content:"";position:absolute;left:4px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--mute)}
.sit li b{color:var(--ink);font-weight:800}
.ask{margin-top:auto;height:236px;display:flex;flex-direction:column}
.ask h3{margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:16px;background:var(--soft);font-weight:800;font-size:16px;border:2px solid transparent;transition:all .3s}
.chip .face{width:36px;height:36px;border-radius:11px}
.chip.win{border-color:var(--jc);background:var(--jbg);transform:scale(1.05)}
.chip.lose{opacity:.3}
.stamp{display:none;font-size:12px;font-weight:800;color:#fff;background:var(--jc);padding:3px 8px;border-radius:99px}
.chip.win .stamp{display:inline-block}
.why{margin-top:auto;min-height:74px;background:var(--jbg);border-radius:18px;padding:14px 18px;font-size:16px;line-height:1.55;font-weight:600;display:flex;align-items:center}
.why b{color:var(--jc);font-weight:800}

/* ── 장면: 투입 ── */
.work{display:grid;grid-template-columns:300px 1fr;gap:32px;height:100%}
.who{background:var(--jbg);border-radius:28px;padding:22px;display:flex;flex-direction:column;align-items:center;text-align:center;height:100%}
.who .chr{width:170px;height:198px;margin-top:6px}
.who-nick{font-size:13.5px;font-weight:800;color:var(--jc);margin-top:6px}
.who-name{font-size:30px;font-weight:900;letter-spacing:-.04em}
.side{display:inline-block;font-size:13px;font-weight:800;color:#fff;background:var(--jc);padding:5px 12px;border-radius:99px;margin-top:8px}
.kq{margin-top:auto;background:var(--card);border-radius:18px;padding:14px 16px;width:100%;text-align:left}
.kq small{display:block;font-size:12px;font-weight:800;color:var(--jc);margin-bottom:4px}
.kq p{font-size:17px;font-weight:800;line-height:1.45}

.wr{display:flex;flex-direction:column;height:100%}
.wr h3{height:30px;margin-bottom:10px}
.steps{height:362px;display:flex;flex-direction:column;gap:3px}
.st{display:grid;grid-template-columns:30px 1fr;gap:14px;align-items:center;padding:0 14px;border-radius:14px;flex:1}
.st:nth-child(odd){background:var(--soft)}
.st .n{width:28px;height:28px;border-radius:9px;background:var(--jc);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
.st .t{font-size:16px;font-weight:800;line-height:1.3}
.st .d{font-size:14px;color:var(--sub);line-height:1.4;margin-top:1px}
.bottom{margin-top:12px;height:198px;display:grid;grid-template-columns:1.3fr 1fr 1.05fr;gap:12px}
.bx{background:var(--soft);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column}
.bx h4{font-size:14px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.bx ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.bx li{font-size:14px;color:var(--sub);line-height:1.4;padding-left:12px;position:relative;font-weight:500}
.bx li:before{content:"";position:absolute;left:1px;top:8px;width:4px;height:4px;border-radius:50%;background:var(--mute)}
.item{display:flex;align-items:center;gap:7px;background:var(--card);border-radius:10px;padding:5px 10px;font-size:13.5px;font-weight:800;border:1.5px dashed var(--jc);margin-bottom:5px}
.bx.res{background:var(--ku-soft)}
.bx.res h4{color:var(--ku)}
.bx.res p{font-size:15.5px;font-weight:800;line-height:1.55}

/* 편 맞히기 */
.sides{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:20px}
.sc{border-radius:26px;padding:20px 22px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--jbg)}
.sc .chr{width:140px;height:163px}
.sc-n{font-size:26px;font-weight:900}
.sc-q{width:100%;height:56px;border-radius:16px;background:var(--card);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:var(--mute);position:relative;margin-top:4px}
.sc-q .f{position:absolute;inset:-2px;border-radius:16px;background:var(--jc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.sc-d{font-size:15.5px;color:var(--sub);line-height:1.5;font-weight:600;min-height:48px}
.foot{margin-top:18px;font-size:17px;font-weight:700;color:var(--sub);text-align:center}

/* 이중 투입 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;height:100%}
.dc{background:var(--jbg);border-radius:26px;padding:18px 22px;display:flex;flex-direction:column}
.dc-top{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.dc-top .chr{width:84px;height:98px}
.dc-n{font-size:24px;font-weight:900}
.dc-s{font-size:14px;font-weight:800;color:var(--jc)}
.dc .kq{margin:0 0 10px}
.dc .steps{height:auto;flex:1}
.dc .st{background:var(--card)!important;padding:10px 14px}

/* 삼각 */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}
.tq{border-radius:26px;padding:20px 22px 26px;background:var(--jbg);text-align:center;display:flex;flex-direction:column;align-items:center}
.tq .chr{width:130px;height:152px}
.tq small{font-size:14px;font-weight:800;color:var(--jc);margin-top:6px}
.tq p{font-size:32px;font-weight:900;letter-spacing:-.04em;margin-top:4px}
.banner{display:inline-flex;align-items:center;gap:10px;background:var(--ku);color:#fff;font-weight:900;font-size:20px;padding:14px 22px;border-radius:18px;margin-top:22px}
.banner.soft{background:var(--ku-soft);color:var(--ku)}

/* 시간 지도 */
.tl{position:relative;margin-top:40px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.tl:before{content:"";position:absolute;left:5%;right:5%;top:46px;height:6px;border-radius:9px;background:var(--line)}
.tn{position:relative;text-align:center}
.tn .disc{width:96px;height:96px;margin:0 auto;border-radius:30px;background:var(--card);box-shadow:inset 0 0 0 3px var(--line);display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;z-index:1}
.tn .y{margin-top:12px;font-size:13px;color:var(--ku);font-weight:800}
.tn .t{font-size:16px;font-weight:800;margin-top:3px}
.tn .ppl{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:12px}
.tn .ppl .face{width:46px;height:46px;border-radius:14px}
.tn .nm{font-size:12.5px;font-weight:800;color:var(--sub);margin-top:6px;line-height:1.4}

/* 마지막 */
.oq{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.oqc{background:var(--soft);border-radius:24px;padding:28px 28px;display:flex;gap:18px;align-items:flex-start;min-height:150px}
.oqc .e{font-size:36px}
.oqc p{font-size:22px;font-weight:800;line-height:1.45}
.oqc span{display:block;font-size:16px;color:var(--sub);font-weight:600;margin-top:6px;line-height:1.5}

.brand{position:absolute;top:42px;right:48px;font-size:12.5px;font-weight:700;color:var(--mute);letter-spacing:-.01em}
#bar{position:fixed;left:0;right:0;bottom:0;height:4px;z-index:9}
#bar i{display:block;height:100%;background:var(--ku);width:0;transition:width .3s}
#num{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-size:12.5px;font-weight:700;color:var(--mute);z-index:9}
#note{position:fixed;left:0;right:0;bottom:0;background:#191F28;color:#fff;padding:18px 26px calc(env(safe-area-inset-bottom,0px) + 18px);font-size:15px;line-height:1.7;display:none;z-index:10}
#note b{color:#7FD0A8;margin-right:8px}
#hint{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-size:12px;color:var(--mute);font-weight:600;z-index:9}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="viewport"><div id="canvas"></div></div>
<div id="bar"><i></i></div>
<div id="num"></div>
<div id="hint"><a href="./" style="color:inherit;text-decoration:none;font-weight:800;margin-right:10px">← KUSC 홈</a>← → 넘기기 · N 발표 노트 · F 전체화면</div>
<div id="note"></div>

<script>
/* ───────── 캐릭터 ───────── */
const J={
  NO:{n:"창업자",nick:"만능 창업자",c:"#7A8591"},
  VC:{n:"VC",nick:"가능성 사냥꾼",c:"#FF7A1A"},
  PM:{n:"PM",nick:"제품 선장",c:"#F04452"},
  BP:{n:"사업기획",nick:"회사 살림꾼",c:"#D99A00"},
  CS:{n:"컨설팅",nick:"문제 탐정",c:"#00A3A3"},
  PE:{n:"PE",nick:"회사 리모델러",c:"#7B61FF"},
  IB:{n:"IB",nick:"거래 설계자",c:"#3182F6"}
};
const ORDER=["NO","VC","PM","BP","CS","PE","IB"];
const jv=k=>`--jc:${J[k].c};--jbg:${J[k].c}1F`;
const chipName=k=>k==="NO"?"아무도 안 부른다":J[k].n;

/* 공통 얼굴 */
function faceParts(){
  return `<circle class="skin" cx="60" cy="54" r="30"/>
  <circle class="eye" cx="50" cy="57" r="3.3"/><circle class="eye" cx="70" cy="57" r="3.3"/>
  <ellipse class="ck" cx="43" cy="65" rx="5" ry="3"/><ellipse class="ck" cx="77" cy="65" rx="5" ry="3"/>
  <path class="mouth" d="M53 68 Q60 74 67 68"/>`;
}
const HAIR=`<path class="hair" d="M30 52 Q30 22 60 22 Q90 22 90 52 Q84 36 62 36 Q44 36 36 46 Q33 49 30 52Z"/>`;
/* 직무별 소품 */
function props(k,c){
  switch(k){
  case "IB": return {head:HAIR,body:`<polygon points="60,82 54,90 60,118 66,90" fill="#1E3A8A"/><rect x="82" y="104" width="26" height="20" rx="4" fill="#7A5230"/><rect x="90" y="99" width="10" height="7" rx="2" fill="none" stroke="#7A5230" stroke-width="3"/>`};
  case "PE": return {head:`<path d="M28 46 Q28 18 60 18 Q92 18 92 46Z" fill="#FFC531"/><rect x="22" y="43" width="76" height="8" rx="4" fill="#F2A900"/><rect x="56" y="18" width="8" height="25" rx="3" fill="#F2A900"/>`,
     body:`<rect x="38" y="94" width="44" height="8" rx="3" fill="#FFC531" opacity=".9"/><rect x="38" y="108" width="44" height="8" rx="3" fill="#FFC531" opacity=".9"/>`};
  case "VC": return {head:HAIR+`<rect x="30" y="38" width="60" height="6" rx="3" fill="#7A4B2A"/><circle cx="47" cy="40" r="9" fill="#9AD8FF" stroke="#7A4B2A" stroke-width="3"/><circle cx="73" cy="40" r="9" fill="#9AD8FF" stroke="#7A4B2A" stroke-width="3"/>`,
     body:`<path d="M94 92 l6 -16 l6 16 l-6 -3z" fill="#F04452"/><rect x="96" y="90" width="8" height="24" rx="4" fill="#FFFFFF" stroke="#C9CFD6" stroke-width="1.5"/><path d="M96 112 l-4 8 h16 l-4 -8z" fill="#FFC531"/>`};
  case "CS": return {head:HAIR+`<circle cx="50" cy="57" r="9" fill="none" stroke="#2B3036" stroke-width="2.6"/><circle cx="70" cy="57" r="9" fill="none" stroke="#2B3036" stroke-width="2.6"/><line x1="59" y1="57" x2="61" y2="57" stroke="#2B3036" stroke-width="2.6"/>`,
     body:`<rect x="78" y="92" width="28" height="34" rx="4" fill="#F4E3C3"/><rect x="86" y="88" width="12" height="7" rx="2" fill="#8A8F96"/><line x1="83" y1="103" x2="101" y2="103" stroke="#B9A57E" stroke-width="2.4"/><line x1="83" y1="110" x2="101" y2="110" stroke="#B9A57E" stroke-width="2.4"/><line x1="83" y1="117" x2="95" y2="117" stroke="#B9A57E" stroke-width="2.4"/>`};
  case "BP": return {head:HAIR+`<rect x="40" y="50" width="16" height="12" rx="3" fill="none" stroke="#2B3036" stroke-width="2.4"/><rect x="64" y="50" width="16" height="12" rx="3" fill="none" stroke="#2B3036" stroke-width="2.4"/><line x1="56" y1="55" x2="64" y2="55" stroke="#2B3036" stroke-width="2.4"/>`,
     body:`<rect x="76" y="90" width="34" height="30" rx="5" fill="#FFFFFF"/><rect x="82" y="106" width="6" height="9" rx="1.5" fill="#3182F6"/><rect x="91" y="100" width="6" height="15" rx="1.5" fill="#F04452"/><rect x="100" y="95" width="6" height="20" rx="1.5" fill="#00A36C"/>`};
  case "PM": return {head:`<path d="M28 48 Q28 20 60 20 Q92 20 92 48Z" fill="${c}"/><rect x="18" y="44" width="34" height="7" rx="3.5" fill="${c}"/><circle cx="60" cy="22" r="4" fill="#FFFFFF"/>`,
     body:`<rect x="84" y="90" width="22" height="36" rx="5" fill="#2B3036"/><rect x="87" y="94" width="16" height="25" rx="2" fill="#9AD8FF"/><rect x="90" y="99" width="10" height="5" rx="1.5" fill="#FFFFFF"/><rect x="90" y="107" width="7" height="5" rx="1.5" fill="#FFFFFF"/>`};
  default: return {head:`<ellipse cx="60" cy="27" rx="25" ry="15" fill="#FFFFFF" stroke="#D6DADF" stroke-width="2"/><circle cx="45" cy="24" r="10" fill="#FFFFFF"/><circle cx="75" cy="24" r="10" fill="#FFFFFF"/><rect x="38" y="30" width="44" height="12" rx="3" fill="#FFFFFF" stroke="#D6DADF" stroke-width="2"/>`,

/* ───────── 조작 ───────── */
const C=document.getElementById("canvas");
C.innerHTML=S.map((s,i)=>`<section class="slide" data-i="${i}">${BRAND}${s.html}</section>`).join("");
const SL=[...C.querySelectorAll(".slide")];
let cur=0,noteOn=false;
function fit(){const s=Math.min(innerWidth/1320,innerHeight/760);C.style.transform=`scale(${s})`;}
addEventListener("resize",fit);fit();
const frags=i=>[...SL[i].querySelectorAll(".f")];
const resetChips=sl=>sl.querySelectorAll(".chip").forEach(c=>c.classList.remove("win","lose"));
function applyReveal(f,sl){const k=f.dataset.reveal;if(!k)return;sl.querySelectorAll(".chip").forEach(c=>c.classList.add(c.dataset.k===k?"win":"lose"));}
function show(i,fromBack){
  cur=Math.max(0,Math.min(SL.length-1,i));
  SL.forEach((s,k)=>s.classList.toggle("on",k===cur));
  const sl=SL[cur],fs=frags(cur);resetChips(sl);
  fs.forEach(f=>f.classList.toggle("in",!!fromBack));
  if(fromBack)fs.forEach(f=>applyReveal(f,sl));
  document.querySelector("#bar i").style.width=(cur/(SL.length-1)*100)+"%";
  document.getElementById("num").textContent=(cur+1)+" / "+SL.length;
  const n=document.getElementById("note");
  n.innerHTML=S[cur].note?"<b>발표 노트</b>"+S[cur].note:"";
  n.style.display=noteOn&&S[cur].note?"block":"none";
  history.replaceState(null,"","#"+(cur+1));
}
function next(){const sl=SL[cur],f=frags(cur).find(x=>!x.classList.contains("in"));
  if(f){f.classList.add("in");applyReveal(f,sl);return}if(cur<SL.length-1)show(cur+1);}
function prev(){const fs=frags(cur).filter(x=>x.classList.contains("in"));
  if(fs.length){const f=fs[fs.length-1];f.classList.remove("in");if(f.dataset.reveal)resetChips(SL[cur]);return}
  if(cur>0)show(cur-1,true);}
addEventListener("keydown",e=>{
  if(["ArrowRight","ArrowDown"," ","PageDown","Enter"].includes(e.key)){e.preventDefault();next()}
  else if(["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==="Home")show(0);else if(e.key==="End")show(SL.length-1,true);
  else if(e.key.toLowerCase()==="n"){noteOn=!noteOn;show(cur,true)}
  else if(e.key.toLowerCase()==="f"){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{});}
});
document.getElementById("viewport").addEventListener("click",e=>{(e.clientX>innerWidth*0.3)?next():prev();});
let tx=null;
addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
addEventListener("touchend",e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40)(d<0?next():prev());tx=null},{passive:true});
show((parseInt(location.hash.slice(1))||1)-1);
</script>
